<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub Pages 게시 시연</title>
<style>
  :root { --bg:#0b0f14; --panel:#151b23; --line:#2a313c; --text:#e6edf3; --muted:#9198a1; --accent:#2f81f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Segoe UI","Malgun Gothic",sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 12px; font-weight:600; }
  canvas { width:100%; height:auto; display:block; border-radius:10px; background:#000; box-shadow:0 10px 40px rgba(0,0,0,.5); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.rec { background:#da3633; border-color:#da3633; color:#fff; font-weight:600; }
  input[type=range] { flex:1; min-width:160px; accent-color:var(--accent); }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); font-size:13px; min-width:90px; text-align:right; }
  .steps { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:6px; margin-top:8px; }
  .steps button { text-align:left; font-size:13px; padding:8px 10px; }
  .steps button.on { border-color:var(--accent); background:#10243f; }
  .note { color:var(--muted); font-size:13px; line-height:1.6; margin-top:14px; }
  #status { color:#f0b72f; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>GitHub Pages로 HTML 웹사이트 게시하기 — 시연 영상</h1>
  <canvas id="c" width="1280" height="720"></canvas>
  <div class="bar">
    <button id="play">⏸ 일시정지</button>
    <button id="prev">⏮ 이전 단계</button>
    <button id="next">다음 단계 ⏭</button>
    <input id="seek" type="range" min="0" max="1000" value="0">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="rec" class="rec">● 영상 파일로 저장</button>
  </div>
  <div id="status"></div>
  <div class="steps" id="steps"></div>
  <p class="note">‘영상 파일로 저장’을 누르면 처음부터 끝까지 재생하면서 녹화한 뒤 자동으로 다운로드됩니다(약 2분, 브라우저에 따라 .mp4 또는 .webm).
  녹화하는 동안에는 이 탭을 화면에 띄워 두세요. 키보드: Space 재생/정지, ← → 단계 이동.</p>
</div>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = '"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif';
const C = { text:'#1f2328', muted:'#59636e', border:'#d1d9e0', link:'#0969da', green:'#1f883d', subtle:'#f6f8fa' };
let now = 0;

// ---------- drawing helpers ----------
function R(x,y,w,h,r,fill,stroke,lw){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function T(s,x,y,o){ o=o||{}; ctx.font=`${o.w||400} ${o.s||14}px ${FONT}`; ctx.fillStyle=o.c||C.text; ctx.textAlign=o.a||'left'; ctx.textBaseline='middle'; ctx.fillText(s,x,y); }
function tw(s,size,w){ ctx.font=`${w||400} ${size}px ${FONT}`; return ctx.measureText(s).width; }
function clamp(v){ return Math.max(0,Math.min(1,v)); }
function ease(t){ t=clamp(t); return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }
function typ(str,t0,t1,s){ return str.slice(0, Math.round(clamp((s-t0)/(t1-t0))*str.length)); }
function caretOn(){ return Math.floor(now*2)%2===0; }
function btn(x,y,w,h,label,kind){
  const k={green:['#1f883d','#fff','#1a7f37'],def:['#f6f8fa','#25292e','#d1d9e0'],dis:['#f6f8fa','#8c959f','#d1d9e0'],blue:['#0969da','#fff','#0969da']}[kind||'def'];
  R(x,y,w,h,6,k[0],k[2]); T(label,x+w/2,y+h/2+1,{c:k[1],w:600,a:'center',s:14});
}
function hl(x,y,w,h){ const p=(Math.sin(now*7)+1)/2; ctx.save(); ctx.strokeStyle=`rgba(255,140,0,${.45+.55*p})`; ctx.lineWidth=3; ctx.beginPath(); ctx.roundRect(x-5,y-5,w+10,h+10,9); ctx.stroke(); ctx.restore(); }
function input(x,y,w,h,val,focus,ph,sel){
  R(x,y,w,h,6,'#fff',focus?'#0969da':C.border,focus?2:1);
  if(sel && val){ const vw=tw(val,14); R(x+9,y+6,vw+2,h-12,2,'#b6d7ff'); }
  if(val) T(val,x+10,y+h/2+1,{s:14}); else if(ph) T(ph,x+10,y+h/2+1,{s:14,c:'#8c959f'});
  if(focus && !sel && caretOn()){ const cx=x+10+tw(val||'',14)+1; ctx.fillStyle=C.text; ctx.fillRect(cx,y+8,1.5,h-16); }
}
function dd(x,y,w,h,label){ R(x,y,w,h,6,'#f6f8fa',C.border); T(label,x+10,y+h/2+1,{s:14,w:600,c:'#25292e'}); T('▾',x+w-16,y+h/2+1,{s:12,c:C.muted}); }
function shadowBox(x,y,w,h,r){ ctx.save(); ctx.shadowColor='rgba(0,0,0,.18)'; ctx.shadowBlur=24; ctx.shadowOffsetY=8; R(x,y,w,h,r||8,'#fff',C.border); ctx.restore(); }

// ---------- browser + GitHub-like chrome ----------
function browser(url){
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,600);
  ctx.fillStyle='#dee1e6'; ctx.fillRect(0,0,W,36);
  R(12,6,250,32,8,'#fff'); T('●',30,22,{s:10,c:'#24292f'}); T(url.split('/')[0],46,22,{s:13,c:'#3c4043'});
  ctx.fillStyle='#fff'; ctx.fillRect(0,36,W,36);
  T('←',22,54,{s:17,c:'#5f6368'}); T('→',50,54,{s:17,c:'#9aa0a6'}); T('⟳',80,55,{s:17,c:'#5f6368'});
  R(110,41,1150,27,14,'#f1f3f4'); T('🔒',126,55,{s:11}); T(url,146,55,{s:13,c:'#202124'});
  ctx.fillStyle='#dadce0'; ctx.fillRect(0,71,W,1);
}
function ghHeader(crumb, tabs, active){
  const bottom = tabs ? 168 : 124;
  ctx.fillStyle=C.subtle; ctx.fillRect(0,72,W,bottom-72); ctx.fillStyle=C.border; ctx.fillRect(0,bottom,W,1);
  R(16,82,34,34,6,'#fff',C.border); for(let i=0;i<3;i++){ ctx.fillStyle='#59636e'; ctx.fillRect(25,92+i*6,16,2); }
  ctx.beginPath(); ctx.arc(78,99,15,0,Math.PI*2); ctx.fillStyle='#1f2328'; ctx.fill();
  let x=104; crumb.forEach((p,i)=>{ const last=i===crumb.length-1; T(p,x,99,{s:15,w:last?600:400}); x+=tw(p,15,last?600:400)+6; if(!last){ T('/',x,99,{s:15,c:C.muted}); x+=14; } });
  R(870,84,300,30,6,'#fff',C.border); T('Type / to search',882,99,{s:13,c:'#8c959f'});
  ctx.beginPath(); ctx.arc(1232,99,15,0,Math.PI*2); ctx.fillStyle='#8250df'; ctx.fill(); T('M',1232,100,{s:13,w:700,c:'#fff',a:'center'});
  if(tabs){ tabs.forEach(t=>{ T(t.l,t.x+t.w/2,146,{s:14,a:'center',w:t.l===active?600:400}); if(t.l===active){ R(t.x+4,164,t.w-8,3,2,'#fd8c73'); } }); }
  ctx.fillStyle='#fff'; ctx.fillRect(0,bottom+1,W,600-bottom-1);
}
const REPO_TABS=[{l:'<> Code',x:20,w:80},{l:'Issues',x:104,w:70},{l:'Pull requests',x:178,w:110},{l:'Actions',x:292,w:78},{l:'Projects',x:374,w:80},{l:'Security',x:458,w:80},{l:'Insights',x:542,w:76},{l:'⚙ Settings',x:622,w:90}];
const PROFILE_TABS=[{l:'Overview',x:20,w:90},{l:'Repositories',x:114,w:110},{l:'Projects',x:228,w:80},{l:'Packages',x:312,w:84},{l:'Stars',x:400,w:60}];
const repoHeader=a=>ghHeader(['my-account','my-website'],REPO_TABS,a);

function codePage(file, msg, commits){
  repoHeader('<> Code');
  T('my-website',20,196,{s:20,w:600}); R(140,186,56,22,11,'#fff',C.border); T('Public',168,197,{s:12,c:C.muted,a:'center'});
  dd(20,220,90,30,'⑂ main'); btn(900,220,100,30,'Go to file'); btn(1010,220,110,30,'Add file ▾'); btn(1130,220,130,30,'<> Code ▾','green');
  R(20,262,1240,92,6,'#fff',C.border); R(20,262,1240,46,[6,6,0,0],C.subtle);
  ctx.beginPath(); ctx.arc(42,285,10,0,Math.PI*2); ctx.fillStyle='#8250df'; ctx.fill();
  T('my-account',60,285,{s:14,w:600}); T(msg,150,285,{s:14,c:C.muted}); T('now · '+commits,1245,285,{s:13,c:C.muted,a:'right'});
  ctx.fillStyle=C.border; ctx.fillRect(20,308,1240,1);
  T('📄',40,331,{s:14}); T(file,64,331,{s:14,c:C.link}); T(msg,420,331,{s:14,c:C.muted}); T('now',1245,331,{s:13,c:C.muted,a:'right'});
  R(20,370,1240,90,6,'#fff',C.border); T('Add a README',640,400,{s:16,w:600,a:'center'}); T('Help people interested in this repository understand your project.',640,428,{s:13,c:C.muted,a:'center'});
}
const HTML_LINES=['<!DOCTYPE html>','<html lang="ko">','<head>','  <meta charset="UTF-8">','  <title>나의 첫 웹사이트</title>','</head>','<body>','  <h1>안녕하세요!</h1>','  <p>GitHub Pages로 만든 첫 웹사이트입니다.</p>','</body>','</html>'];
function codeLines(x,y,n,lines){ (lines||HTML_LINES).slice(0,n).forEach((l,i)=>{ T(String(i+1),x+28,y+i*22,{s:13,c:'#8c959f',a:'right'}); T(l,x+50,y+i*22,{s:13,c:l.trim().startsWith('<')?'#116329':C.text}); }); }

const SIDEBAR=[['General',195],['#Access',228],['Collaborators',254],['Moderation options',280],['#Code and automation',313],['Branches',339],['Tags',365],['Rules',391],['Actions',417],['Webhooks',443],['Environments',469],['Codespaces',495],['Pages',521]];
function settingsPage(active){
  repoHeader('⚙ Settings');
  SIDEBAR.forEach(([n,y])=>{
    if(n[0]==='#'){ T(n.slice(1),30,y,{s:12,w:600,c:C.muted}); return; }
    if(n===active){ R(20,y-14,260,28,6,'#eef1f4'); R(20,y-10,4,20,2,'#fd8c73'); }
    T(n,40,y,{s:14,w:n===active?600:400});
  });
  ctx.fillStyle=C.border; ctx.fillRect(300,180,1,410);
}
function pagesMain(o){
  let y=200;
  T('GitHub Pages',320,y,{s:24,w:400}); T('GitHub Pages is designed to host your personal, organization, or project pages from a GitHub repository.',320,y+28,{s:13,c:C.muted});
  ctx.fillStyle=C.border; ctx.fillRect(320,y+46,940,1);
  y+=50;
  if(o.live){
    R(320,y+6,940,58,6,'#dafbe1','#4ac26b');
    T('Your site is live at ',336,y+26,{s:15,w:600}); T('https://my-account.github.io/my-website/',336+tw('Your site is live at ',15,600),y+26,{s:15,w:600,c:C.link});
    T('Last deployed by my-account now',336,y+48,{s:12,c:C.muted});
    btn(1140,y+19,105,32,'↗ Visit site'); if(o.hlVisit) hl(1140,y+19,105,32);
    y+=72;
  }
  T('Build and deployment',320,y+28,{s:18,w:600});
  T('Source',320,y+58,{s:14,w:600});
  dd(320,y+72,o.actions?170:210,30, o.actions?'GitHub Actions':'Deploy from a branch');
  if(o.actions){
    T('Use a suggested workflow, browse all workflows, or create your own.',320,y+124,{s:13,c:C.muted});
    R(320,y+140,300,64,6,'#fff',C.border); T('Static HTML',336,y+160,{s:14,w:600}); T('Deploy static files without a build.',336,y+184,{s:12,c:C.muted});
  } else {
    T('Branch',320,y+128,{s:14,w:600});
    T(o.branch==='main'&&o.saved?'Your GitHub Pages site is currently being built from the main branch.':'GitHub Pages is currently disabled. Select a source below to enable GitHub Pages for this repository.',320,y+150,{s:13,c:C.muted});
    dd(320,y+165,120,30,'⑂ '+(o.branch||'None'));
    if(o.branch==='main') dd(450,y+165,120,30,'📁 / (root)'); else { R(450,y+165,120,30,6,'#f6f8fa',C.border); T('📁 / (root)',460,y+181,{s:14,c:'#8c959f'}); }
    btn(580,y+165,70,30,'Save', o.branch==='main'?'def':'dis');
    if(o.saved && !o.live){ R(320,y+210,420,34,6,'#dafbe1','#4ac26b'); T('✓  GitHub Pages source saved.',334,y+227,{s:14,c:'#1a7f37',w:600}); }
  }
}
function menu(x,y,w,title,items){ // items: [label, sub?]
  const ih = items.some(i=>i[1])?52:32; const h=40+items.length*ih;
  shadowBox(x,y,w,h); T(title,x+14,y+20,{s:13,w:600}); ctx.fillStyle=C.border; ctx.fillRect(x,y+38,w,1);
  items.forEach((it,i)=>{ const iy=y+40+i*ih; if(it[2]) R(x+4,iy+2,w-8,ih-4,6,'#eef1f4'); T(it[0],x+16,iy+(it[1]?18:16),{s:14,w:it[1]?600:400}); if(it[1]) T(it[1],x+16,iy+38,{s:12,c:C.muted}); });
}

// ---------- scenes ----------
// cur: [time, x, y, click?] — cursor arrives at (x,y) at time; click if 4th = 1
const SCENES = [];
function S(o){ SCENES.push(o); }

S({ dur:5, intro:true, draw(s){
  const g=ctx.createLinearGradient(0,0,W,H); g.addColorStop(0,'#0d1117'); g.addColorStop(1,'#132a4a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const a=ease(s/1.0); ctx.globalAlpha=a;
  T('따라하기 시연',640,250,{s:22,c:'#58a6ff',a:'center',w:600});
  T('GitHub Pages로 HTML 웹사이트 게시하기',640,320,{s:48,c:'#fff',a:'center',w:700});
  T('HTML 파일 하나만 있으면 누구나 볼 수 있는 웹사이트 주소가 생겨요',640,385,{s:22,c:'#c9d1d9',a:'center'});
  R(370,440,540,44,22,'rgba(47,129,247,.18)','#2f81f7'); T('게시 14단계 + 문제 해결 + 수정해서 다시 게시하기',640,463,{s:18,c:'#cfe3ff',a:'center',w:600});
  ctx.globalAlpha=1;
}});

S({ dur:7, step:1, t:'GitHub에 로그인합니다', d:'github.com 에 접속해 아이디와 비밀번호 입력 → Sign in',
 cur:[[0,900,520],[1.0,640,232,1],[2.9,640,297,1],[4.9,640,353,1]],
 draw(s){
  browser('github.com/login');
  ctx.beginPath(); ctx.arc(640,110,22,0,Math.PI*2); ctx.fillStyle='#1f2328'; ctx.fill();
  T('Sign in to GitHub',640,160,{s:24,a:'center'});
  R(440,185,400,205,8,C.subtle,C.border);
  T('Username or email address',460,206,{s:14,w:600});
  input(460,216,360,32, typ('my-account',1.2,2.5,s), s>1&&s<2.9);
  T('Password',460,268,{s:14,w:600}); T('Forgot password?',820,268,{s:12,c:C.link,a:'right'});
  input(460,280,360,32, '●'.repeat(Math.round(clamp((s-3.1)/1.1)*8)), s>2.9&&s<4.9);
  btn(460,336,360,34,'Sign in','green'); if(s>4.2&&s<5) hl(460,336,360,34);
  if(s>5.3){ ctx.globalAlpha=ease((s-5.3)/.4); R(520,420,240,40,20,'#1a7f37'); T('✓ 로그인 완료',640,441,{s:16,c:'#fff',a:'center',w:600}); ctx.globalAlpha=1; }
 }});

S({ dur:8, step:2, t:'새 저장소(Repository) 만들기 시작', d:'왼쪽 위 메뉴(☰) → All repositories → New repository',
 cur:[[0,640,441],[1.1,33,99,1],[2.9,120,482,1],[5.3,1165,206,1]],
 draw(s){
  if(s<3.2){
    browser('github.com');
    ghHeader(['Dashboard']);
    T('Top repositories',20,160,{s:14,w:600}); btn(240,146,56,28,'New','green');
    input(20,182,276,30,'',false,'Find a repository…'); T('아직 저장소가 없습니다',20,236,{s:13,c:C.muted});
    T('Home',330,160,{s:20,w:600});
    for(let i=0;i<3;i++){ R(330,186+i*130,920,116,8,'#fff',C.border); R(350,210+i*130,300,12,6,'#eaeef2'); R(350,236+i*130,820,10,5,'#f0f2f5'); R(350,256+i*130,700,10,5,'#f0f2f5'); }
    if(s>1.1){
      const a=ease((s-1.1)/.35); const dx=-320+320*a;
      ctx.fillStyle=`rgba(0,0,0,${.3*a})`; ctx.fillRect(0,72,W,528);
      ctx.save(); ctx.shadowColor='rgba(0,0,0,.25)'; ctx.shadowBlur=20; ctx.fillStyle='#fff'; ctx.fillRect(dx,72,320,528); ctx.restore();
      ctx.beginPath(); ctx.arc(dx+36,104,15,0,Math.PI*2); ctx.fillStyle='#1f2328'; ctx.fill(); T('✕',dx+292,104,{s:16,c:C.muted,a:'center'});
      ['🏠  Home','⊙  Issues','⇄  Pull requests','▦  Projects','💬  Discussions','☁  Codespaces','🧭  Explore'].forEach((n,i)=>T(n,dx+24,150+i*38,{s:15}));
      ctx.fillStyle=C.border; ctx.fillRect(dx+16,428,288,1);
      T('Repositories',dx+24,450,{s:12,w:600,c:C.muted});
      R(dx+12,466,296,34,6,s>2.2?'#eef1f4':'#fff'); T('📚  All repositories',dx+24,483,{s:15,w:600});
      if(s>1.8&&s<2.9) hl(dx+12,466,296,34);
    }
  } else {
    browser('github.com/my-account?tab=repositories');
    ghHeader(['my-account'],PROFILE_TABS,'Repositories');
    ctx.beginPath(); ctx.arc(140,280,85,0,Math.PI*2); ctx.fillStyle='#8250df'; ctx.fill(); T('M',140,282,{s:60,w:700,c:'#fff',a:'center'});
    T('my-account',60,395,{s:20,w:600});
    input(320,190,560,32,'',false,'Find a repository…'); btn(890,190,80,32,'Type ▾'); btn(980,190,80,32,'Sort ▾');
    btn(1090,190,150,32,'📕 New repository','green'); if(s>4.0&&s<5.3) hl(1090,190,150,32);
    T('my-account doesn’t have any public repositories yet.',780,300,{s:16,c:C.muted,a:'center'});
  }
 }});

S({ dur:8, step:3, t:'저장소 이름을 입력하고 만들기', d:'Repository name 입력 → Public(공개) 확인 → Create repository',
 cur:[[0,1165,206],[0.9,660,291,1],[4.0,360,430],[5.6,865,547,1]],
 draw(s){
  browser('github.com/new'); ghHeader(['New repository']);
  T('Create a new repository',340,196,{s:24,w:600});
  T('A repository contains all project files, including the revision history.',340,226,{s:13,c:C.muted});
  T('Owner *',340,258,{s:14,w:600}); T('Repository name *',520,258,{s:14,w:600});
  dd(340,275,150,32,'my-account'); T('/',505,291,{s:20,c:C.muted,a:'center'});
  input(520,275,280,32, typ('my-website',1.2,2.6,s), s>0.9&&s<5.5);
  if(s>1.2&&s<3.6) hl(520,275,280,32);
  if(s>2.8){ T('✓ my-website is available.',520,324,{s:13,c:'#1a7f37',w:600}); }
  T('Description (optional)',340,352,{s:14,w:600}); input(340,366,600,32,'');
  // visibility
  ctx.beginPath(); ctx.arc(352,430,8,0,Math.PI*2); ctx.strokeStyle='#0969da'; ctx.lineWidth=2; ctx.stroke(); ctx.beginPath(); ctx.arc(352,430,4,0,Math.PI*2); ctx.fillStyle='#0969da'; ctx.fill();
  T('Public',370,424,{s:14,w:600}); T('Anyone on the internet can see this repository.',370,444,{s:12,c:C.muted});

// ---------- timeline ----------
const STARTS=[]; let TOTAL=0;
SCENES.forEach(sc=>{ STARTS.push(TOTAL); TOTAL+=sc.dur; if(sc.setup) sc.setup.call(sc); });
const STEPS_N = SCENES.filter(s=>s.step).length;

function curPos(keys,s){
  if(s<=keys[0][0]) return [keys[0][1],keys[0][2]];
  for(let i=1;i<keys.length;i++){ const a=keys[i-1], b=keys[i];
    if(s<=b[0]){ const st=Math.max(a[0], b[0]-0.9); if(s<st) return [a[1],a[2]]; const t=ease((s-st)/(b[0]-st)); return [a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; } }
  const l=keys[keys.length-1]; return [l[1],l[2]];
}
function drawCursor(x,y,press){
  ctx.save(); ctx.translate(x,y); if(press) ctx.scale(.88,.88);
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,23); ctx.lineTo(5.5,17.5); ctx.lineTo(9.5,26.5); ctx.lineTo(13,25); ctx.lineTo(9,16.5); ctx.lineTo(16,16.5); ctx.closePath();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=4; ctx.shadowOffsetY=2;
  ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowColor='transparent'; ctx.strokeStyle='#000'; ctx.lineWidth=1.6; ctx.stroke(); ctx.restore();
}
function caption(sc, s){
  ctx.fillStyle='#0d1117'; ctx.fillRect(0,600,W,120);
  const a=ease(s/.4); ctx.globalAlpha=a;
  const label=sc.badge||`STEP ${sc.step} / ${STEPS_N}`; const bw=Math.max(128,tw(label,15,700)+28);
  R(30,620,bw,32,16,sc.color||'#1f6feb'); T(label,30+bw/2,637,{s:15,w:700,c:'#fff',a:'center'});
  const tx=30+bw+20;
  T(sc.t,tx,636,{s:26,w:700,c:'#fff'});
  T(sc.d,tx,678,{s:18,c:'#b7c0cc'});
  ctx.globalAlpha=1;
}
function sceneAt(t){ let i=0; while(i<SCENES.length-1 && t>=STARTS[i+1]) i++; return i; }
function render(){
  const i=sceneAt(now), sc=SCENES[i], s=now-STARTS[i];
  ctx.save(); sc.draw(s); ctx.restore();
  if(sc.step||sc.badge) caption(sc,s);
  if(sc.cur){
    const [cx,cy]=curPos(sc.cur,s); let press=false;
    sc.cur.forEach(k=>{ if(k[3] && s>=k[0] && s<k[0]+0.5){ const p=(s-k[0])/0.5; press = press || p<0.25;
      ctx.beginPath(); ctx.arc(k[1],k[2],8+26*p,0,Math.PI*2); ctx.strokeStyle=`rgba(255,140,0,${1-p})`; ctx.lineWidth=3; ctx.stroke();
      ctx.beginPath(); ctx.arc(k[1],k[2],10*(1-p)+2,0,Math.PI*2); ctx.fillStyle=`rgba(255,140,0,${.5*(1-p)})`; ctx.fill(); } });
    if(sc.overlay) sc.overlay(s,cx,cy);
    drawCursor(cx,cy,press);
  }
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.fillRect(0,H-4,W,4); ctx.fillStyle='#2f81f7'; ctx.fillRect(0,H-4,W*now/TOTAL,4);
}

// ---------- player ----------
let playing=true, last=null, recorder=null, chunks=[];
const $=id=>document.getElementById(id);
const fmt=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
const stepsEl=$('steps');
SCENES.forEach((sc,i)=>{ const b=document.createElement('button'); b.textContent = sc.step ? `${sc.step}. ${sc.t}` : sc.badge ? `[${sc.badge}] ${sc.t}` : sc.section ? `■ ${sc.section} 시작` : (sc.intro?'▶ 시작':'✔ 한눈에 정리'); b.onclick=()=>seek(STARTS[i]); stepsEl.appendChild(b); });
function seek(t){ if(recorder) return; now=Math.max(0,Math.min(TOTAL-0.001,t)); }
function setPlaying(p){ playing=p; $('play').textContent=p?'⏸ 일시정지':'▶ 재생'; }
$('play').onclick=()=>{ if(recorder) return; if(!playing && now>=TOTAL-0.01) now=0; setPlaying(!playing); };
$('prev').onclick=()=>{ const i=sceneAt(now); seek(now-STARTS[i]>1.5?STARTS[i]:STARTS[Math.max(0,i-1)]); };
$('next').onclick=()=>{ const i=sceneAt(now); seek(STARTS[Math.min(SCENES.length-1,i+1)]); };
$('seek').oninput=e=>seek(e.target.value/1000*TOTAL);
document.addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();$('play').click();} if(e.code==='ArrowRight')$('next').click(); if(e.code==='ArrowLeft')$('prev').click(); });

$('rec').onclick=()=>{
  if(recorder) return;
  if(!cv.captureStream || !window.MediaRecorder){ $('status').textContent='이 브라우저는 녹화를 지원하지 않습니다. Chrome 또는 Edge에서 열어 주세요.'; return; }
  const mime=['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const stream=cv.captureStream(30);
  recorder=new MediaRecorder(stream,{mimeType:mime, videoBitsPerSecond:8000000}); chunks=[];
  recorder.ondataavailable=e=>{ if(e.data.size) chunks.push(e.data); };
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:mime}); const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='GitHub_Pages_게시방법_시연.'+(mime.includes('mp4')?'mp4':'webm'); a.click();
    $('status').textContent='✔ 저장 완료: '+a.download+' (다운로드 폴더 확인)'; $('rec').textContent='● 영상 파일로 저장'; recorder=null;
  };
  now=0; setPlaying(true); recorder.start(1000);
  $('rec').textContent='● 녹화 중…'; $('status').textContent='녹화 중입니다. 끝날 때까지(약 '+fmt(TOTAL)+') 이 탭을 화면에 띄워 두세요.';
};

function frame(ts){
  if(last==null) last=ts; const dt=Math.min(0.1,(ts-last)/1000); last=ts;
  if(playing){ now+=dt; if(now>=TOTAL){ now=TOTAL-0.001; setPlaying(false); if(recorder && recorder.state==='recording') setTimeout(()=>recorder.stop(),300); } }
  render();
  $('seek').value=Math.round(now/TOTAL*1000); $('time').textContent=fmt(now)+' / '+fmt(TOTAL);
  const i=sceneAt(now); [...stepsEl.children].forEach((b,j)=>b.classList.toggle('on',j===i));
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
